<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kosice Miniliga - League Table</title>
    <style>
        /* --- Reset & Base --- */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 10px 0; 
            margin: 0;
            box-sizing: border-box;
            background-color: #f2f4f8;
            color: #333;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin: 15px 0 25px 0;
            font-size: 1.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container { 
            width: 96%; 
            max-width: 1000px;
            margin: 0 auto; 
        }

        /* --- Table Wrapper --- */
        .table-wrapper {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto; 
            border: 1px solid #e1e4e8;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 600px; 
        }

        th, td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }

        /* --- Header Styles --- */
        th {
            background-color: #4A90E2;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Sticky "Team Name" Column */
        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            left: 0;
            z-index: 11;
            text-align: left;
            border-right: 2px solid #f0f0f0;
        }
        th:nth-child(2) { z-index: 12; }
        td:nth-child(2) { background-color: #fff; font-weight: 600; color: #2c3e50; }

        /* --- Row Styles --- */
        .main-row { cursor: pointer; transition: background-color 0.1s; }
        .main-row:hover td { background-color: #f8f9fa; }
        /* Sticky column hover fix */
        .main-row:hover td:nth-child(2) { background-color: #f8f9fa; }

        /* --- Expanded Detail Row Styles (NEW) --- */
        .detail-row {
            display: none; /* Hidden by default */
            background-color: #fcfcfc;
        }
        .detail-row.open {
            display: table-row;
        }
        .detail-cell {
            padding: 0 !important; /* Remove standard padding */
            border-bottom: 2px solid #ddd !important;
            background-color: #f8f9fa;
        }

        /* Match History Grid inside Expanded Row */
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            padding: 15px;
            white-space: normal; /* Allow text wrapping inside cards */
        }

        .history-card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 5px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            border-left: 5px solid #ccc; /* Default Draw color */
        }
        
        .history-card.win { border-left-color: #28a745; }
        .history-card.lose { border-left-color: #dc3545; }

        .hc-date { font-size: 0.75em; color: #888; text-transform: uppercase; margin-bottom: 5px; font-weight: 700;}
        .hc-opponent { font-weight: 600; font-size: 0.9em; margin-bottom: 5px; color: #333; }
        .hc-score { font-size: 1.1em; font-weight: 800; color: #333; }
        .hc-result { font-size: 0.8em; float: right; }

        /* --- Column Specifics --- */
        .col-pos { font-weight: bold; color: #888; width: 40px; }
        .col-pts { font-weight: 900; color: #4A90E2; font-size: 1.1em; background-color: #fbfbfb; }
        .col-score { font-family: monospace; font-size: 1.1em; letter-spacing: -1px; }

        /* Expand Icon */
        .expand-icon {
            display: inline-block;
            font-size: 0.7em;
            margin-left: 8px;
            color: #999;
            transition: transform 0.2s;
        }
        .main-row.active .expand-icon { transform: rotate(180deg); }

        @media screen and (max-width: 600px) {
            h1 { font-size: 1.4em; }
            th, td { padding: 10px 5px; font-size: 13px; }
            .history-grid { grid-template-columns: 1fr; } /* 1 column on mobile */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>League Standings</h1>
    
    <div class="table-wrapper">
        <table id="leagueTable">
            <thead>
                <tr>
                    <th class="col-pos">#</th>
                    <th>Team Name</th>
                    <th>Matches</th>
                    <th>Win</th>
                    <th>Draw</th>
                    <th>Lose</th>
                    <th>Score</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script src="matchData.js"></script>

<script>
    // ============================================================
    // 1. AGGREGATE DATA
    // ============================================================
    
    // Step A: Group individual games into Team Matches
    // Key = Date + TeamA + TeamB
    // We store this globally so we can access it when generating history
    const teamMatchesArray = [];

    const tempMatches = {};

    matchResults.forEach(m => {
        const key = `${m.date}::${m.player_a_team}::${m.player_b_team}`;
        if (!tempMatches[key]) {
            tempMatches[key] = {
                date: m.date,
                teamA: m.player_a_team,
                teamB: m.player_b_team,
                scoreA: 0,
                scoreB: 0
            };
        }
        const sA = parseInt(m.score_a);
        const sB = parseInt(m.score_b);
        if (sA > sB) tempMatches[key].scoreA++;
        if (sB > sA) tempMatches[key].scoreB++;
    });
    
    // Push objects to array for easier filtering later
    for (const key in tempMatches) {
        teamMatchesArray.push(tempMatches[key]);
    }

    // Step B: Initialize Team Stats Objects
    const teams = {};

    function initTeam(name) {
        if (!teams[name]) {
            teams[name] = {
                name: name,
                matches: 0,
                wins: 0,
                draws: 0,
                losses: 0,
                scoreFor: 0,    
                scoreAgainst: 0,
                points: 0
            };
        }
    }

    // Step C: Calculate League Stats
    teamMatchesArray.forEach(match => {
        const tA = match.teamA;
        const tB = match.teamB;
        const sA = match.scoreA;
        const sB = match.scoreB;

        initTeam(tA);
        initTeam(tB);

        // Update Matches Played
        teams[tA].matches++;
        teams[tB].matches++;

        // Update Scores
        teams[tA].scoreFor += sA;
        teams[tA].scoreAgainst += sB;
        teams[tB].scoreFor += sB;
        teams[tB].scoreAgainst += sA;

        // Update W/D/L and Points
        if (sA > sB) {
            teams[tA].wins++;
            teams[tA].points += 3;
            teams[tB].losses++;
            teams[tB].points += 1;
        } else if (sB > sA) {
            teams[tB].wins++;
            teams[tB].points += 3;
            teams[tA].losses++;
            teams[tA].points += 1;
        } else {
            teams[tA].draws++;
            teams[tA].points += 2;
            teams[tB].draws++;
            teams[tB].points += 2;
        }
    });

    // ============================================================
    // 2. SORTING
    // ============================================================
    const leagueTable = Object.values(teams).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        const diffA = a.scoreFor - a.scoreAgainst;
        const diffB = b.scoreFor - b.scoreAgainst;
        return diffB - diffA;
    });

    // ============================================================
    // 3. RENDER
    // ============================================================
    const tbody = document.getElementById('tableBody');

    // Helper: Generate HTML for the expanded history section
    function getTeamHistoryHtml(teamName) {
        // Filter all matches where this team played
        const myMatches = teamMatchesArray.filter(m => m.teamA === teamName || m.teamB === teamName);
        
        // Sort chronologically (or reverse if you prefer newest first)
        // Since dates are strings like "1. kolo", finding a perfect sort is tricky without a map.
        // We will assume the array order is roughly correct.
        
        let html = `<div class="history-grid">`;
        
        if (myMatches.length === 0) {
            return `<div style="padding:15px; text-align:center; color:#999;">No matches found</div>`;
        }

        myMatches.forEach(m => {
            const isHome = m.teamA === teamName;
            const opponent = isHome ? m.teamB : m.teamA;
            const myScore = isHome ? m.scoreA : m.scoreB;
            const oppScore = isHome ? m.scoreB : m.scoreA;
            
            let statusClass = ""; // Default Draw
            let resultText = "D";
            
            if (myScore > oppScore) {
                statusClass = "win";
                resultText = "W";
            } else if (oppScore > myScore) {
                statusClass = "lose";
                resultText = "L";
            }

            html += `
                <div class="history-card ${statusClass}">
                    <div class="hc-date">${m.date}</div>
                    <div class="hc-opponent">vs. ${opponent}</div>
                    <div class="hc-score">
                        ${myScore}:${oppScore} 
                        <span class="hc-result">(${resultText})</span>
                    </div>
                </div>
            `;
        });
        
        html += `</div>`;
        return html;
    }

    leagueTable.forEach((team, index) => {
        // 1. Create Main Row
        const tr = document.createElement('tr');
        tr.className = 'main-row';
        tr.innerHTML = `
            <td class="col-pos">${index + 1}.</td>
            <td>${team.name} <span class="expand-icon">▼</span></td>
            <td>${team.matches}</td>
            <td>${team.wins}</td>
            <td>${team.draws}</td>
            <td>${team.losses}</td>
            <td class="col-score">${team.scoreFor}:${team.scoreAgainst}</td>
            <td class="col-pts">${team.points}</td>
        `;
        
        // 2. Create Detail Row (Hidden initially)
        const detailTr = document.createElement('tr');
        detailTr.className = 'detail-row';
        detailTr.innerHTML = `
            <td colspan="8" class="detail-cell">
                ${getTeamHistoryHtml(team.name)}
            </td>
        `;

        // 3. Add Click Event to Toggle
        tr.onclick = () => {
            const isOpen = detailTr.classList.contains('open');
            
            // Close all others first? (Optional - keeping multiple open allows comparison)
            // For now, simple toggle
            if (isOpen) {
                detailTr.classList.remove('open');
                tr.classList.remove('active');
            } else {
                detailTr.classList.add('open');
                tr.classList.add('active');
            }
        };

        tbody.appendChild(tr);
        tbody.appendChild(detailTr);
    });

</script>

</body>
</html>
