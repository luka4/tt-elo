<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Table Tennis ELO Ratings</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- Reset & Base --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Table Wrappers (The Fix for Mobile) --- */
        .table-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
            margin-bottom: 20px;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            background: white;
            border-radius: 4px;
        }

        /* --- Tables --- */
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
            min-width: 800px; /* Forces table to be wide enough to read, enabling scroll */
        }

        th, td {
            padding: 10px 8px;
            border: 1px solid #eee;
            text-align: center;
            white-space: nowrap; /* Prevents text from wrapping awkwardly */
        }

        th {
            position: sticky;
            top: 0;
            background: #d3d3d3;
            z-index: 10;
            font-weight: 600;
        }

        thead { background: #d3d3d3; }

        /* --- Main Table Interactive Rows --- */
        #mainTableBody tr {
            cursor: pointer;
            transition: background-color 0.15s;
        }
        #mainTableBody tr:hover {
            background-color: #f0f0f0;
            outline: 1px solid #aaa;
            z-index: 5;
        }

        /* --- Team Colors --- */
        .team-cokery { background-color: #87BAC3 !important; }
        .team-astoria { background-color: #BBC863 !important; }

        /* --- History Section --- */
        #historyContainer {
            display: none;
            margin-bottom: 30px;
        }
        .history-section {
            margin: 20px 0;
            border: 2px solid #4A90E2;
            padding: 10px;
            border-radius: 5px;
            background: #fff;
        }
        .history-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4A90E2;
        }
        .history-table th { background-color: #4A90E2; color: white; }
        .history-table tr:nth-child(even) { background-color: #f8f9fa; }
        .history-table tr { cursor: default; }

        .win { color: #28a745; font-weight: bold; }
        .loss { color: #dc3545; font-weight: bold; }

        /* --- Chart Container --- */
        #chartContainerWrapper {
            display: none;
            position: relative;
            height: 500px; /* Desktop Height */
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            padding: 10px;
            box-sizing: border-box;
            background: white;
            border-radius: 5px;
        }

        /* =========================================
           MOBILE RESPONSIVENESS
           ========================================= */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
            }

            /* Make Chart Shorter on Mobile so it fits on one screen */
            #chartContainerWrapper {
                height: 300px;
            }

            /* Shrink Table Font & Padding to fit more data */
            table {
                font-size: 11px;
            }
            th, td {
                padding: 6px 3px;
            }

            /* Optional: Sticky First Column for Player Name */
            #mainTable td:nth-child(2), #mainTable th:nth-child(2) {
                position: sticky;
                left: 0;
                background: inherit; /* Keep row color */
                z-index: 11;
                border-right: 2px solid #ccc;
            }
            /* Ensure Sticky Header sits above Sticky Column */
            #mainTable th:nth-child(2) {
                z-index: 12;
                background: #d3d3d3;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div id="chartContainerWrapper">

    // =================================================================
    // 2. CONFIGURATION
    // =================================================================
    const initialRating = 100;
    const players = {};

    // =================================================================
    // 3. LOGIC
    // =================================================================

    function getKFactor(matches) {
        if (matches === 1) return 30;
        if (matches === 2) return 26;
        if (matches === 3) return 22;
        if (matches === 4) return 18;
        if (matches === 5) return 14;
        return 10;
    }

    function initPlayer(name) {
        if (!players[name]) {
            players[name] = {
                name: name,
                rating: initialRating,
                matches: 0,
                wins: 0,
                losses: 0,
                setsWin: 0,
                setsLose: 0,
                maxRating: initialRating,
                minRating: initialRating,
                team: 'N/A',
                lastPlayed: 'N/A',
                bestWinOpponent: null,
                bestWinRating: -Infinity,
                history: {},
                matchDetails: []
            };
        }
    }

    matchResults.forEach(match => {
        const scoreA = parseInt(match.score_a);
        const scoreB = parseInt(match.score_b);
        const playerA = match.player_a;
        const playerB = match.player_b;
        const date = match.date;
        const teamA = match.player_a_team;
        const teamB = match.player_b_team;

        initPlayer(playerA);
        initPlayer(playerB);

        players[playerA].team = teamA;
        players[playerA].lastPlayed = date;
        players[playerB].team = teamB;
        players[playerB].lastPlayed = date;

        const N = scoreA + scoreB;
        const Ra = players[playerA].rating;
        const Rb = players[playerB].rating;

        players[playerA].matches++;
        players[playerB].matches++;

        const Ea = N / (1 + Math.pow(10, (Rb - Ra) / 300));
        const Eb = N / (1 + Math.pow(10, (Ra - Rb) / 300));

        const Ka = getKFactor(players[playerA].matches);
        const Kb = getKFactor(players[playerB].matches);

        if (scoreA > scoreB) {
            if (players[playerB].rating > players[playerA].bestWinRating) {
                players[playerA].bestWinOpponent = playerB;
                players[playerA].bestWinRating = players[playerB].rating;
            }
        }
        if (scoreB > scoreA) {
            if (players[playerA].rating > players[playerB].bestWinRating) {
                players[playerB].bestWinOpponent = playerA;
                players[playerB].bestWinRating = players[playerA].rating;
            }
        }

        const newRa = Ra + Ka * (scoreA - Ea);
        const newRb = Rb + Kb * (scoreB - Eb);

        players[playerA].rating = newRa;
        players[playerB].rating = newRb;

        players[playerA].history[date] = newRa;
        players[playerB].history[date] = newRb;

        players[playerA].maxRating = Math.max(players[playerA].rating, players[playerA].maxRating);
        players[playerB].maxRating = Math.max(players[playerB].rating, players[playerB].maxRating);
        players[playerA].minRating = Math.min(players[playerA].rating, players[playerA].minRating);
        players[playerB].minRating = Math.min(players[playerB].rating, players[playerB].minRating);

        players[playerA].wins += (scoreA > scoreB ? 1 : 0);
        players[playerB].wins += (scoreB > scoreA ? 1 : 0);
        players[playerA].losses += (scoreA < scoreB ? 1 : 0);
        players[playerB].losses += (scoreB < scoreA ? 1 : 0);

        players[playerA].setsWin += scoreA;
        players[playerB].setsWin += scoreB;
        players[playerA].setsLose += scoreB;
        players[playerB].setsLose += scoreA;

        players[playerA].matchDetails.push({
            date: date,
            opponent: playerB,
            opponent_team: teamB,
            score_own: scoreA,
            score_opp: scoreB,
            rating_after: newRa,
            opp_rating_after: newRb
        });

        players[playerB].matchDetails.push({
            date: date,
            opponent: playerA,
            opponent_team: teamA,
            score_own: scoreB,
            score_opp: scoreA,
            rating_after: newRb,
            opp_rating_after: newRa
        });
    });

    const sortedPlayers = Object.values(players).sort((a, b) => b.rating - a.rating);

    // =================================================================
    // 4. RENDERING
    // =================================================================

    let chartInstance = null;
    let activePlayerName = null;

    function renderTable() {
        const tbody = document.getElementById('mainTableBody');
        tbody.innerHTML = '';

        sortedPlayers.forEach((p, index) => {
            const tr = document.createElement('tr');

            if (p.team === 'COKERY') tr.classList.add('team-cokery');
            if (p.team === 'ASTORIA FIT') tr.classList.add('team-astoria');

            tr.onclick = () => togglePlayerView(p.name);

            const successMatches = p.matches > 0 ? ((p.wins / p.matches) * 100).toFixed(2) : 0;
            const totalSets = p.setsWin + p.setsLose;
            const successSets = totalSets > 0 ? ((p.setsWin / totalSets) * 100).toFixed(2) : 0;

            const bestWinStr = p.bestWinOpponent ? `${p.bestWinOpponent} (${p.bestWinRating.toFixed(2)})` : '';

            tr.innerHTML = `
<td>${index + 1}</td>
<td>${p.name}</td>
<td>${p.rating.toFixed(2)}</td>
<td>${p.maxRating.toFixed(2)}</td>
<td>${p.minRating.toFixed(2)}</td>
<td>${p.matches}</td>
<td>${p.wins}</td>
<td>${p.losses}</td>
<td>${p.setsWin}:${p.setsLose}</td>
<td>${successMatches}</td>
<td>${successSets}</td>
<td>${p.team}</td>
<td>${bestWinStr}</td>
<td>${p.lastPlayed}</td>
`;
            tbody.appendChild(tr);
        });
    }

    function togglePlayerView(name) {
        const chartWrapper = document.getElementById('chartContainerWrapper');
        const historyContainer = document.getElementById('historyContainer');

        if (activePlayerName === name) {
            activePlayerName = null;
            chartWrapper.style.display = 'none';
            historyContainer.style.display = 'none';
        } else {
            activePlayerName = name;
            chartWrapper.style.display = 'block';
            historyContainer.style.display = 'block';

            renderChart(name);
            renderHistory(name);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function renderHistory(name) {
        const p = players[name];
        const container = document.getElementById('historyContainer');

// Note: We add table-scroll-wrapper here too for mobile responsiveness
        let html = `
<div class='history-section'>
<div class='history-title'>Match History: ${p.name} (${p.team})</div>
<div class="table-scroll-wrapper">
<table class='history-table'>
<thead>
<tr>
<th>Date</th>
<th>Score</th>
<th>Opponent</th>
<th>Opponent Team</th>
<th>Opponent Rating (Post)</th>
<th>${p.name} Rating (Post)</th>
</tr>
</thead>
<tbody>
`;

// Sort history: Newest first? Or Oldest first? Current logic preserves processing order (Oldest first)
// If you want newest first, add .reverse() to matchDetails copy
        p.matchDetails.forEach(m => {
            const isWin = m.score_own > m.score_opp;
            const scoreClass = isWin ? 'win' : 'loss';
            html += `
<tr>
<td>${m.date}</td>
<td class="${scoreClass}">${m.score_own}:${m.score_opp}</td>
<td>${m.opponent}</td>
<td>${m.opponent_team}</td>
<td>${m.opp_rating_after.toFixed(2)}</td>
<td>${m.rating_after.toFixed(2)}</td>
</tr>
`;
        });

        html += `</tbody></table></div></div>`;
        container.innerHTML = html;
    }

    function renderChart(name) {
        const ctx = document.getElementById('ratingChart').getContext('2d');
        const p = players[name];

        const rawDates = Object.keys(p.history);
        const sortedDates = rawDates.sort((a, b) =>
            a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
        );
        const dataPoints = sortedDates.map(date => p.history[date]);

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: sortedDates,
                datasets: [{
                    label: p.name,
                    data: dataPoints,
                    borderColor: '#4A90E2',
                    backgroundColor: 'rgba(74, 144, 226, 0.1)',
                    borderWidth: 2,
                    pointRadius: 4,
                    tension: 0.1,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, // Critical for responsiveness
                scales: {
                    x: {
                        title: { display: true, text: 'Match Event' },
                        ticks: { autoSkip: true, maxTicksLimit: 10 } // Prevents text bunching on mobile
                    },
                    y: {
                        title: { display: true, text: 'Rating' }
                    }
                },
                plugins: {
                    legend: { display: true }
                }
            }
        });
    }

    renderTable();

</script>

</body>
</html>
