<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RP5HV7SX60"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RP5HV7SX60');
    </script>
    <title>Košická Miniliga - Výsledky</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/loader.css">
    <link rel="stylesheet" href="styles/shared.css">
    <link rel="stylesheet" href="styles/results.css">
</head>
<body id="page-results" class="loading">

<div id="pageLoader">
    <div class="loader">
        <div class="scene">
            <div class="ball"></div>
            <div class="racket">
                <div class="blade"></div>
                <div class="handle"></div>
            </div>
        </div>
        <div class="loading-text">Načítava sa</div>
    </div>
</div>
<div id="pageContent">
    <div id="mainNavContainer"></div>

    <div class="container" id="mainContainer">
        <h2>Výsledky Tímových Zápasov</h2>
        <div class="results-filter-section">
            <label for="resultsTeamFilter">Filtrovať podľa tímu:</label>
            <input type="text" id="resultsTeamFilter" list="resultsTeamsList" placeholder="Začnite písať názov tímu..." autocomplete="off">
            <datalist id="resultsTeamsList"></datalist>
            <button id="applyTeamFilterBtn" class="results-filter-btn">Filtrovať</button>
            <button id="clearTeamFilterBtn" class="results-filter-btn results-filter-btn--clear" style="display: none;">Zrušiť filter</button>
        </div>
        <div id="resultsContainer"></div>
    </div>
</div>

<script src="googleSheetsLoader.js?v=2"></script>
<script src="matchData.js?v=7"></script>
<script src="script.js?v=10"></script>
</body>
</html>
