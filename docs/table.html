<div id="pageLoader">
    <div class="loader">
        <div class="scene">
            <div class="table"></div>
            <div class="net"></div>
            <div class="racket left"></div>
            <div class="racket right"></div>
            <div class="ball"></div>
        </div>
        <div class="loading-text">Načítava sa</div>
    </div>
</div>

<div id="pageContent">
    <div id="mainNavContainer"></div>
    <div class="container" id="mainContainer">
        <h2>Tabuľka Ligy</h2>
        <div id="tablesContainer"></div>
        <div class="prediction-wrapper">
            <div class="pred-title">Predikcia Zápasu</div>
            <div class="pred-controls"><select id="teamSelectA">
                <option value="">Vyber Domácich</option>
            </select><span class="pred-vs">VS</span><select id="teamSelectB">
                <option value="">Vyber Hostí</option>
            </select></div>
            <button class="pred-btn" onclick="calculatePrediction()">Vypočítať Výsledok</button>
            <div id="predictionResult" class="pred-result">
                <div class="score-prediction" id="predScore">0 : 0</div>
                <div class="pred-details">
                    <div class="rating-box">Ø Rating: <span class="rating-val" id="rateA">0</span></div>
                    <div class="rating-box">Ø Rating: <span class="rating-val" id="rateB">0</span></div>
                </div>
            </div>
        </div>
    </div>
</div>
