<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Košická Miniliga | Miniliga Košice | Stolný tenis Košice</title>
    <meta name="description" content="Oficiálne výsledky, tabuľky a ratingy hráčov pre Košickú stolnotenisovú Miniligu.">
    <meta property="og:title" content="Košická Miniliga - Stolný tenis">
    <meta property="og:description" content="Aktuálne výsledky, tabuľky a ratingy hráčov.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://luka4.github.io/tt-elo/">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="loader.css">
    <link rel="stylesheet" href="styles/shared.css">
    <link rel="stylesheet" href="styles/home.css">
</head>
<body id="page-home" class="loading">

<div id="pageLoader">
    <div class="loader">
        <div class="scene">
            <div class="ball"></div>
            <div class="racket">
                <div class="blade"></div>
                <div class="handle"></div>
            </div>
        </div>
        <div class="loading-text">Načítava sa</div>
    </div>
</div>
<div id="pageContent">
    <div id="mainNavContainer"></div>

    <div class="container" id="mainContainer">
        <div class="stats-grid">
            <div class="stat-box"><span class="stat-number" id="totalRounds">0</span><span class="stat-label">Odohraných Kôl</span></div>
            <div class="stat-box"><span class="stat-number" id="totalTeamMatches">0</span><span class="stat-label">Tímových Zápasov</span></div>
            <div class="stat-box"><span class="stat-number" id="totalMatches">0</span><span class="stat-label">Všetkých Zápasov</span></div>
            <div class="stat-box"><span class="stat-number" id="totalSets">0</span><span class="stat-label">Odohraných Setov</span></div>
        </div>
        <div class="section-header"><h2 id="latestRoundTitle">Aktuálne Kolo</h2></div>
        <div id="latestRoundContainer"></div>

        <div class="section-header"><h2>Predchádzajúce Kolo: <span id="prevRoundTitle"></span></h2></div>
        <div id="prevRoundContainer"></div>

        <div id="upcomingMatchesContainer">
            <div class="section-header"><h2>Nadchádzajúce Zápasy: <span id="nextRoundTitle"></span></h2></div>
            <div id="upcomingList" class="upcoming-list"></div>
        </div>

        <div class="section-header"><h2>Top 5 Skokanov Kola</h2></div>
        <ul class="top-players-list" id="topGainersList"></ul>

        <div class="section-header"><h2>Top 5 Prekvapení Kola</h2></div>
        <div id="upsetContainer" class="upset-list"></div>
    </div>
</div>

<script src="matchData.js?v=5"></script>
<script src="script.js?v=5"></script>
</body>
</html>
